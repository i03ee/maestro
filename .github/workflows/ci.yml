name: quality-gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Repository invariants
        run: python3 scripts/validate_repo.py

      - name: Dependency and license gate
        run: python3 scripts/check_licenses.py

      - name: Company catalogue check
        run: python3 scripts/catalogue_report.py --check

      - name: Acceptance witnesses (AC-01..AC-20)
        run: python3 scripts/verify_acceptance.py

      - name: Unit and contract tests
        run: python3 -m unittest discover -s tests -v

      - name: Evidence chain self-test
        run: python3 -m maestro.evidence.log

  agent-layer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the optional agent layer
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[agent]"

      - name: Repository invariants
        run: python3 scripts/validate_repo.py

      - name: Dependency and license gate
        run: python3 scripts/check_licenses.py

      - name: Company catalogue check
        run: python3 scripts/catalogue_report.py --check

      - name: Acceptance witnesses (AC-01..AC-20)
        run: python3 scripts/verify_acceptance.py

      - name: Full suite including the agent layer
        run: python3 -m unittest discover -s tests -v
